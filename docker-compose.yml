services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    environment:
      - REDIS_URL=redis://localhost:6379/0
    volumes:
      - db_data:/app/data
      - ./custom_emojis.json:/app/custom_emojis.json
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
